name: CI

on:
  push:
    branches: [main]
    tags: [demo-ready]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Health check (make check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up mission-tool-dev environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: mission-tool-dev
          init-shell: bash
          cache-environment: true

      - name: make check
        shell: bash -el {0}
        run: make check

  quality:
    name: Quality (ruff, mypy, coverage, audit, secrets)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Set up mission-tool-dev environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: mission-tool-dev
          init-shell: bash
          cache-environment: true

      - name: make quality
        shell: bash -el {0}
        run: make quality

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
