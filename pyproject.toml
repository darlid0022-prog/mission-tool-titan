[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["app_services", "mission", "trajectory"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "trajectory_backup.py",
    "trajectory_placeholder_backup.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
    "trajectory_backup.py",
    "trajectory_placeholder_backup.py",
]

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "pykep", "pykep.*"]
ignore_missing_imports = true
